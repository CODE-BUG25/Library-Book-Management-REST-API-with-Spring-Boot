$kind: http-request
url: "{{baseUrl}}/books"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "bookId": 101,
      "title": "Duplicate",
      "author": "X",
      "genre": "Y",
      "availableCopies": 2
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 409', function () { pm.response.to.have.status(409); });
    language: text/javascript
order: 5000
