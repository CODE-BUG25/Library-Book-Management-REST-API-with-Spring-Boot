$kind: http-request
url: "{{baseUrl}}/books"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "bookId": 202,
      "title": "Bad Copies",
      "author": "X",
      "genre": "Y",
      "availableCopies": -1
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 6000
